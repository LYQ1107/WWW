[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmot"
version = "0.1.0"
description = "World-coordinate multi-view tracking research pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
runtime = ["torch", "torchvision", "opencv-python", "scipy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
